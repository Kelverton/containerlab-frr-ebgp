frr version 8.4
frr defaults traditional
hostname frr-router04
!
interface eth1
 ip address 10.24.0.4/30
!
interface eth2
 ip address 10.34.0.4/30
!
interface eth3
 ip address 192.168.4.1/24
!
interface lo
 ip address 192.168.4.1/32
!
router bgp 65004
 bgp router-id 192.168.4.1
 neighbor 10.24.0.2 remote-as 65002
 neighbor 10.34.0.3 remote-as 65003
 !
 address-family ipv4 unicast
  network 192.168.4.0/24
  neighbor 10.24.0.2 activate
  neighbor 10.34.0.3 activate
 exit-address-family
!
end
