frr version 8.4
frr defaults traditional
hostname frr-router03
!
interface eth1
 ip address 10.34.0.3/30
!
interface eth2
 ip address 10.13.0.3/30
!
interface eth3
 ip address 192.168.3.1/24
!
interface lo
 ip address 192.168.3.1/32
!
router bgp 65003
 bgp router-id 192.168.3.1
 neighbor 10.13.0.1 remote-as 65001
 neighbor 10.34.0.4 remote-as 65004
 !
 address-family ipv4 unicast
  network 192.168.3.0/24
  neighbor 10.13.0.1 activate
  neighbor 10.34.0.4 activate
 exit-address-family
!
end
